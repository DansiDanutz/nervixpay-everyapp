name: Verify release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: verify-${{ github.ref }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm types:check
      - run: pnpm exec everyapp release --json
      - uses: actions/upload-artifact@v4
        with: { name: everyapp-release, path: everyapp-release.tar.gz }
